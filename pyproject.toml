[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tonkit"
version = "0.1.0"
description = "Catalyst-lifetime (TON) kinetics with off-cycle reservoirs: network spec, stiff ODEs, closed forms, exact single-molecule laws and Gillespie runs"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
fast = ["numba>=0.56"]
test = ["pytest>=7", "mpmath"]
plots = ["matplotlib"]

[tool.setuptools]
packages = ["tonkit", "tonkit.plotting"]

[tool.setuptools.package-data]
"tonkit.plotting" = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long stochastic runs (deselect with -m 'not slow')"]
